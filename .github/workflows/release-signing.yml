name: Sign release sources

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test release source
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sign:
    name: Sign and verify release source archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Sign release archives with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          release-signing-artifacts: true
          verify: true
          verify-cert-identity: https://github.com/zhoushengyu0214-jpg/carljohn/.github/workflows/release-signing.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
